{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Campus Hub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/features.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="shell navigation" aria-label="Main navigation">
            <a class="brand" href="{% url 'home' %}">Campus Hub</a>
            <div class="nav-actions">
                <a href="{% url 'event_list' %}">Campus events</a>
                <a href="{% url 'bulletin:board' %}">Bulletin board</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}">My profile</a>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button class="button button-secondary" type="submit">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Log in</a>
                    <a class="button" href="{% url 'register' %}">Sign up</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
