{% extends 'index.html' %}
{% load static %}
<!-- Make your own events for people to see right here! -->
{% block content %}
<title>Add an Event</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

<link  href ="{% static 'css/styles_add.css' %}" rel="stylesheet">


<div class="form-container">
        <h1>Add a New Event</h1>

        <form method="POST">
        {% csrf_token %}

        <!-- Helps the submitter know what account they're sending it under, to avoid submitting as an organizer or student -->
                <p>Logged in as: <strong>{{request.user}}</strong></p>

        <label class="form-label">Event Name:</label>
        <input class="form-control" type="text"
                name="name" required>

        <!-- Will add a date/time later, need to do the basics right now-->
        <!-- <label class="form-label mt-3">Event Date:</label>
        <input class="form-control" type="date"
                name="datetime" required> -->

        <label class="form-label mt-3">Location:</label>
        <input class="form-control" type="text"
                name="location" required>
        
        <label class="form-label mt-3">Description:</label>    
        <input class="form-control" type="text"
                name="desc" required>

        <button class="btn btn-primary mt-3"
                type="submit">Save Event</button>
        </form>
</div>
{% endblock %}
